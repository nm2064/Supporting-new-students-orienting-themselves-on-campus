        const LANG_OPTIONS = [
            { id: "en", label: "English" },
            { id: "zh-Hans", label: "简体中文" },
            { id: "hi", label: "हिन्दी" },
            { id: "ar", label: "العربية" },
        ];

        const LanguageContext = createContext(null);

        const readStoredLang = () => {
            try {
                const value = localStorage.getItem(STORAGE_UI_LANG) || "en";
                return SUPPORTED_LANGS.includes(value) ? value : "en";
            } catch (e) {
                return "en";
            }
        };

        const readStoredAutoDetect = () => {
            try {
                const value = localStorage.getItem(STORAGE_AUTO_DETECT);
                return value === null ? true : value === "true";
            } catch (e) {
                return true;
            }
        };

        const LanguageProvider = ({ children }) => {
            const [uiLanguage, setUiLanguage] = useState(readStoredLang);
            const [autoDetectEnabled, setAutoDetectEnabled] = useState(readStoredAutoDetect);
            const [sessionDetectedLanguage, setSessionDetectedLanguageState] = useState(null);

            const activeLanguage = autoDetectEnabled && sessionDetectedLanguage
                ? sessionDetectedLanguage
                : uiLanguage;

            useEffect(() => {
                try { localStorage.setItem(STORAGE_UI_LANG, uiLanguage); } catch (e) {}
            }, [uiLanguage]);

            useEffect(() => {
                try { localStorage.setItem(STORAGE_AUTO_DETECT, String(autoDetectEnabled)); } catch (e) {}
            }, [autoDetectEnabled]);

            useEffect(() => {
                document.documentElement.lang = activeLanguage;
                document.documentElement.dir = activeLanguage === "ar" ? "rtl" : "ltr";
            }, [activeLanguage]);

            const setLanguage = (lang) => {
                if (!SUPPORTED_LANGS.includes(lang)) return;
                setUiLanguage(lang);
                setSessionDetectedLanguageState(null);
            };

            const toggleAutoDetect = () => {
                setAutoDetectEnabled((prev) => {
                    const next = !prev;
                    if (!next) {
                        setSessionDetectedLanguageState(null);
                    }
                    return next;
                });
            };

            const setSessionDetectedLanguage = (lang) => {
                if (!autoDetectEnabled || !SUPPORTED_LANGS.includes(lang)) return;
                setSessionDetectedLanguageState(lang);
            };

            const value = useMemo(() => ({
                uiLanguage,
                autoDetectEnabled,
                sessionDetectedLanguage,
                activeLanguage,
                setLanguage,
                toggleAutoDetect,
                setSessionDetectedLanguage,
            }), [uiLanguage, autoDetectEnabled, sessionDetectedLanguage, activeLanguage]);

            return <LanguageContext.Provider value={value}>{children}</LanguageContext.Provider>;
        };

        const useLanguage = () => useContext(LanguageContext);

        const useT = () => {
            const { activeLanguage } = useLanguage();
            return I18N[activeLanguage] || I18N.en;
        };

                { id: "services", icon: "apps", label: t.navServices, path: "/services" },

                <nav className="fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-background-dark/95 backdrop-blur border-t border-gray-200 dark:border-gray-800 px-2 py-2 z-50">

        };

        const HomePage = () => {
            const t = useT();
            return (

                    <Header />
                    <main className="max-w-[960px] mx-auto px-4 py-8">

                            </Link>
                            <Link to="/map" className="p-5 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
                                <span className="material-symbols-outlined text-primary">map</span>
                                <p className="font-bold mt-2">{t.navMap}</p>
                            </Link>
                            <Link to="/services" className="p-5 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
                                <span className="material-symbols-outlined text-primary">grid_view</span>

                            </Link>
                            <Link to="/events" className="p-5 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
                                <span className="material-symbols-outlined text-primary">event</span>
                                <p className="font-bold mt-2">{t.navEvents}</p>
                            </Link>
                        </div>
                    </main>
                    <BottomNav active="home" />
                </div>
            );
        };

        const ChatPage = () => {
            const t = useT();
            const { uiLanguage, autoDetectEnabled, setSessionDetectedLanguage } = useLanguage();
            const [messages, setMessages] = useState([{ role: "assistant", text: t.assistantIntro }]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const [followUps, setFollowUps] = useState([]);
            const [lastEffectiveLanguage, setLastEffectiveLanguage] = useState(null);
            const [lastConfidence, setLastConfidence] = useState(null);
            const [expandedCitations, setExpandedCitations] = useState({});

            useEffect(() => {
                setMessages((prev) => {
                    if (prev.length === 1 && prev[0].role === "assistant") {
                        return [{ role: "assistant", text: t.assistantIntro }];
                    }
                    return prev;
                });
            }, [t.assistantIntro]);

            const getConversationId = () => {
                let id = localStorage.getItem("unibot_conversation_id");
                if (!id) {
                    id = (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
                    localStorage.setItem("unibot_conversation_id", id);
                }
                return id;
            };

            const sendMessage = async () => {
                if (!input.trim() || loading) return;
                const userText = input.trim();
                setInput("");
                setLoading(true);
                setMessages((prev) => [...prev, { role: "user", text: userText }]);

                try {
                    const res = await fetch("http://localhost:8000/rag-chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: userText,
                            conversation_id: getConversationId(),
                            ui_language: uiLanguage,
                            auto_detect: autoDetectEnabled
                        }),
                    });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);

                    const data = await res.json();
                    const answer = data.answer_markdown || data.answer || "No answer returned.";
                    const citations = Array.isArray(data.citations) ? data.citations : (data.sources || []);

                    setMessages((prev) => [...prev, {
                        role: "assistant",
                        text: answer,
                        citations,
                        needsHumanHandoff: !!data.needs_human_handoff,
                        clarifyingQuestion: data.clarifying_question || null,
                    }]);

                    if (data.clarifying_question) {
                        setMessages((prev) => [...prev, { role: "assistant", text: data.clarifying_question }]);
                    }

                    setFollowUps(Array.isArray(data.follow_up_suggestions) ? data.follow_up_suggestions : []);
                    setLastEffectiveLanguage(data.effective_language || null);
                    setLastConfidence(typeof data.confidence === "number" ? data.confidence : null);

                    if (autoDetectEnabled && data.effective_language) {
                        setSessionDetectedLanguage(data.effective_language);
                    }
                } catch (err) {
                    setMessages((prev) => [...prev, { role: "assistant", text: "Error contacting backend. Please try again." }]);
                } finally {
                    setLoading(false);
                }
            };

            const clearChat = () => {
                setMessages([{ role: "assistant", text: t.assistantIntro }]);
                setFollowUps([]);
                localStorage.removeItem("unibot_conversation_id");
            };

            return (
                <div className="bg-background-light dark:bg-background-dark font-display flex justify-center min-h-screen pb-24">
                    <div className="relative w-full max-w-[520px] bg-white dark:bg-gray-900 shadow-2xl flex flex-col h-screen overflow-hidden border-x border-gray-100 dark:border-gray-800">
                        <div className="flex items-center justify-between px-4 py-3 border-b border-gray-100 dark:border-gray-800 bg-white/95 dark:bg-gray-900/95">
                            <div>
                                <h2 className="font-bold">UniBot</h2>
                                <p className="text-xs text-gray-500">
                                    {lastEffectiveLanguage ? `effective_language=${lastEffectiveLanguage}` : "effective_language=n/a"}
                                    {lastConfidence !== null ? ` • confidence=${Math.round(lastConfidence * 100)}%` : ""}
                                </p>
                            </div>
                            <button onClick={clearChat} className="px-3 py-1.5 text-sm bg-gray-100 dark:bg-gray-800 rounded-lg">{t.clear}</button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-4 text-start">
                            {messages.map((msg, idx) => {
                                const isUser = msg.role === "user";
                                return (
                                    <div key={idx} className={`flex ${isUser ? "justify-end" : "justify-start"}`}>
                                        <div className={`max-w-[85%] rounded-2xl px-4 py-3 ${isUser ? "bg-primary text-white" : "bg-gray-100 dark:bg-gray-800"}`}>
                                            <div className="whitespace-pre-wrap text-sm leading-relaxed">{msg.text}</div>
                                            {msg.citations && msg.citations.length > 0 && (
                                                <div className="mt-2 border-t border-gray-300/40 pt-2">
                                                    <button onClick={() => setExpandedCitations((prev) => ({ ...prev, [idx]: !prev[idx] }))} className="text-xs text-primary">
                                                        {expandedCitations[idx] ? "Hide citations" : "Show citations"}
                                                    </button>
                                                    {expandedCitations[idx] && (
                                                        <div className="mt-2 space-y-2">
                                                            {msg.citations.map((c, cIdx) => (
                                                                <div key={cIdx} className="text-xs bg-white/60 dark:bg-black/20 rounded-md p-2">
                                                                    <div>{c.chunk_id || c.source || `source_${cIdx + 1}`}</div>
                                                                    <div className="text-gray-500">{c.source_url || c.source || ""}</div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                            {loading && <div className="text-xs text-gray-500">...</div>}
                        </div>

                        {followUps.length > 0 && (
                            <div className="px-4 py-2 border-t border-gray-200 dark:border-gray-800">
                                <p className="text-xs text-gray-500 mb-2">{t.quickQuestions}</p>
                                <div className="flex gap-2 overflow-x-auto hide-scrollbar">
                                    {followUps.map((item, i) => (
                                        <button key={i} onClick={() => setInput(item)} className="px-3 py-1.5 rounded-full bg-gray-100 dark:bg-gray-800 text-xs whitespace-nowrap">{item}</button>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="p-4 border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
                            <div className="flex items-center gap-2 bg-gray-100 dark:bg-gray-800 rounded-2xl px-3 py-2">
                                <input
                                    className="flex-1 bg-transparent outline-none text-sm"
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); sendMessage(); }}}
                                    placeholder={t.chatPlaceholder}
                                />
                                <button onClick={sendMessage} disabled={loading || !input.trim()} className="bg-primary text-white w-10 h-10 rounded-xl disabled:opacity-50">
                                    <span className="material-symbols-outlined text-xl">send</span>
                                </button>
                            </div>
                        </div>
                        <BottomNav active="chat" />
                    </div>
                </div>
            );
        };

        const MapPage = () => {
            const t = useT();
            const { activeLanguage } = useLanguage();
            const mapContainerRef = useRef(null);
            const mapRef = useRef(null);
            const destinationMarkerRef = useRef(null);
            const manualOriginMarkerRef = useRef(null);
            const currentMarkerRef = useRef(null);
            const currentAccuracyRef = useRef(null);
            const routeLayerRef = useRef(null);
            const originModeRef = useRef("manual");

            const [sheetState, setSheetState] = useState("half");
            const [searchQuery, setSearchQuery] = useState("");
            const [searchResults, setSearchResults] = useState([]);
            const [originSearchQuery, setOriginSearchQuery] = useState("");
            const [originSearchResults, setOriginSearchResults] = useState([]);
            const [locationPermission, setLocationPermission] = useState("unknown");
            const [currentLocation, setCurrentLocation] = useState(null);
            const [locationAccuracy, setLocationAccuracy] = useState(null);
            const [originMode, setOriginMode] = useState("manual");
            const [manualOrigin, setManualOrigin] = useState(null);
            const [selectedDestination, setSelectedDestination] = useState(null);
            const [profile, setProfile] = useState("foot");
            const [route, setRoute] = useState(null);
            const [loadingRoute, setLoadingRoute] = useState(false);
            const [routeError, setRouteError] = useState(null);
            const [leafletReady, setLeafletReady] = useState(!!window.L);

            useEffect(() => {
                originModeRef.current = originMode;
            }, [originMode]);

            const localeTag = activeLanguage === "zh-Hans" ? "zh-CN" : activeLanguage;
            const formatDistance = (meters) => {
                if (meters >= 1000) {
                    return `${new Intl.NumberFormat(localeTag, { maximumFractionDigits: 1 }).format(meters / 1000)} km`;
                }
                return `${new Intl.NumberFormat(localeTag, { maximumFractionDigits: 0 }).format(meters)} m`;
            };
            const formatDuration = (seconds) => {
                const totalMin = Math.round(seconds / 60);
                const h = Math.floor(totalMin / 60);
                const m = totalMin % 60;
                if (h > 0) return `${h}h ${m}m`;
                return `${m}m`;
            };

            useEffect(() => {
                if (!mapContainerRef.current || mapRef.current || !window.L) return;
                const map = window.L.map(mapContainerRef.current, { zoomControl: true }).setView([55.90985, -3.32015], 16);
                window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                    maxZoom: 19,
                    attribution: "&copy; OpenStreetMap contributors"
                }).addTo(map);

                map.on("click", (event) => {
                    if (originModeRef.current !== "manual") return;
                    const nextOrigin = {
                        lat: event.latlng.lat,
                        lng: event.latlng.lng,
                        name: "Origin"
                    };
                    setManualOrigin(nextOrigin);
                    setOriginSearchQuery(`${nextOrigin.lat.toFixed(5)}, ${nextOrigin.lng.toFixed(5)}`);
                });

                mapRef.current = map;
                setLeafletReady(true);
                setTimeout(() => map.invalidateSize(), 120);
                return () => map.remove();
            }, []);

            useEffect(() => {
                if (!mapRef.current) return;
                const id = setTimeout(() => mapRef.current && mapRef.current.invalidateSize(), 180);
                return () => clearTimeout(id);
            }, [sheetState]);

            useEffect(() => {
                if (!mapRef.current) return;
                const onResize = () => mapRef.current && mapRef.current.invalidateSize();
                window.addEventListener("resize", onResize);
                return () => window.removeEventListener("resize", onResize);
            }, []);

            useEffect(() => {
                if (!selectedDestination || !mapRef.current || !window.L) return;
                if (destinationMarkerRef.current) destinationMarkerRef.current.remove();
                destinationMarkerRef.current = window.L.marker(
                    [selectedDestination.lat, selectedDestination.lng],
                    { draggable: true }
                ).addTo(mapRef.current);
                destinationMarkerRef.current.on("dragend", (event) => {
                    const next = event.target.getLatLng();
                    setSelectedDestination((prev) => {
                        if (!prev) return prev;
                        return { ...prev, lat: next.lat, lng: next.lng };
                    });
                });
                destinationMarkerRef.current.bindPopup(`${t.mapDestinationLabel}: ${selectedDestination.name}`).openPopup();
            }, [selectedDestination, activeLanguage]);

            useEffect(() => {
                if (!mapRef.current || !window.L) return;
                if (manualOriginMarkerRef.current) {
                    manualOriginMarkerRef.current.remove();
                    manualOriginMarkerRef.current = null;
                }
                if (originMode === "manual" && manualOrigin) {
                    manualOriginMarkerRef.current = window.L.marker([manualOrigin.lat, manualOrigin.lng]).addTo(mapRef.current);
                    manualOriginMarkerRef.current.bindPopup(`${t.mapOriginPin}`).openPopup();
                }
            }, [originMode, manualOrigin, activeLanguage]);

            useEffect(() => {
                if (!mapRef.current || !window.L) return;
                if (currentMarkerRef.current) currentMarkerRef.current.remove();
                if (currentAccuracyRef.current) currentAccuracyRef.current.remove();
                if (currentLocation) {
                    currentMarkerRef.current = window.L.marker([currentLocation.lat, currentLocation.lng]).addTo(mapRef.current);
                    currentMarkerRef.current.bindPopup(t.mapCurrentLocationLabel);
                    if (locationAccuracy) {
                        currentAccuracyRef.current = window.L.circle([currentLocation.lat, currentLocation.lng], {
                            radius: locationAccuracy,
                            weight: 1,
                            opacity: 0.4,
                            fillOpacity: 0.12
                        }).addTo(mapRef.current);
                    }
                }
            }, [currentLocation, locationAccuracy, activeLanguage]);

            useEffect(() => {
                if (!mapRef.current || !window.L) return;
                if (routeLayerRef.current) {
                    routeLayerRef.current.remove();
                    routeLayerRef.current = null;
                }
                if (route && route.geometry && Array.isArray(route.geometry.coordinates)) {
                    const latlngs = route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
                    if (latlngs.length < 2) return;
                    routeLayerRef.current = window.L.polyline(latlngs, {
                        color: "#135bec",
                        weight: 5,
                        opacity: 0.9
                    }).addTo(mapRef.current);
                    mapRef.current.fitBounds(routeLayerRef.current.getBounds(), { padding: [24, 24] });
                }
            }, [route]);

            useEffect(() => {
                const term = searchQuery.trim();
                if (!term) {
                    setSearchResults([]);
                    return;
                }
                const timeout = setTimeout(async () => {
                    try {
                        const res = await fetch(`${API_BASE}/api/places?query=${encodeURIComponent(term)}`);
                        if (!res.ok) return;
                        const data = await res.json();
                        setSearchResults(Array.isArray(data) ? data : []);
                    } catch (e) {}
                }, 250);
                return () => clearTimeout(timeout);
            }, [searchQuery]);

            useEffect(() => {
                const term = originSearchQuery.trim();
                if (originMode !== "manual" || !term) {
                    setOriginSearchResults([]);
                    return;
                }
                const timeout = setTimeout(async () => {
                    try {
                        const res = await fetch(`${API_BASE}/api/places?query=${encodeURIComponent(term)}`);
                        if (!res.ok) return;
                        const data = await res.json();
                        setOriginSearchResults(Array.isArray(data) ? data : []);
                    } catch (e) {}
                }, 250);
                return () => clearTimeout(timeout);
            }, [originSearchQuery, originMode]);

            const selectDestination = (place) => {
                setSelectedDestination(place);
                setSearchQuery(place.name);
                setSearchResults([]);
                if (mapRef.current) mapRef.current.panTo([place.lat, place.lng]);
            };

            const selectManualOrigin = (place) => {
                setManualOrigin(place);
                setOriginSearchQuery(place.name);
                setOriginSearchResults([]);
                if (mapRef.current) mapRef.current.panTo([place.lat, place.lng]);
            };

            const enableLocation = () => {
                if (!navigator.geolocation) {
                    setLocationPermission("unavailable");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const nextLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            name: t.mapCurrentLocationLabel
                        };
                        setLocationPermission("granted");
                        setCurrentLocation(nextLocation);
                        setLocationAccuracy(position.coords.accuracy || null);
                        setOriginMode("gps");
                        if (mapRef.current) mapRef.current.panTo([nextLocation.lat, nextLocation.lng]);
                    },
                    () => {
                        setLocationPermission("denied");
                        setOriginMode("manual");
                    },
                    { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
                );
            };

            const useMyLocationAsOrigin = () => {
                if (locationPermission === "granted" && currentLocation) {
                    setOriginMode("gps");
                    if (mapRef.current) mapRef.current.panTo([currentLocation.lat, currentLocation.lng]);
                    return;
                }
                enableLocation();
            };

            const requestDirections = async (originOverride = null) => {
                if (!selectedDestination) {
                    setRouteError(t.mapNoDestination);
                    return;
                }
                const origin = originOverride || (originMode === "gps" ? currentLocation : manualOrigin);
                if (!origin) {
                    setRouteError(t.mapNoOrigin);
                    return;
                }

                setLoadingRoute(true);
                setRouteError(null);
                try {
                    const res = await fetch(`${API_BASE}/api/route`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            profile,
                            origin: { lat: origin.lat, lng: origin.lng },
                            destination: { lat: selectedDestination.lat, lng: selectedDestination.lng },
                            locale: activeLanguage
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        setRouteError(data.detail || t.mapRoutingUnavailable);
                        return;
                    }
                    setRoute(data);
                    setSheetState("full");
                } catch (e) {
                    setRouteError(t.mapRoutingUnavailable);
                } finally {
                    setLoadingRoute(false);
                }
            };

            const reroute = () => {
                if (locationPermission !== "granted" || !currentLocation) return;
                setOriginMode("gps");
                requestDirections(currentLocation);
            };

            const clearRoute = () => {
                setRoute(null);
                setRouteError(null);
            };

            return (
                <div className="h-screen w-full relative overflow-hidden bg-background-light dark:bg-background-dark">
                    <div ref={mapContainerRef} className="absolute inset-0" />
                    <div className="absolute top-4 start-4 z-[500] bg-white/88 dark:bg-gray-900/88 backdrop-blur rounded-2xl p-3 shadow-lg max-w-[300px] border border-white/60 dark:border-gray-700/80">
                        {locationPermission !== "granted" && (
                            <button onClick={enableLocation} className="w-full px-3 py-2 text-sm rounded-lg bg-primary text-white">
                                {t.mapEnableLocation}
                            </button>
                        )}
                        {locationPermission === "denied" && (
                            <p className="mt-2 text-xs text-amber-700 dark:text-amber-300">{t.mapLocationDenied}</p>
                        )}
                        {locationPermission === "unavailable" && (
                            <p className="mt-2 text-xs text-amber-700 dark:text-amber-300">{t.mapLocationUnavailable}</p>
                        )}
                        {!leafletReady && (
                            <p className="mt-2 text-xs text-red-700 dark:text-red-300">Map engine failed to load. Refresh the page.</p>
                        )}
                    </div>

                    <div
                        dir={activeLanguage === "ar" ? "rtl" : "ltr"}
                        className={`bottom-sheet ${sheetState} absolute left-0 right-0 bottom-20 z-[500] bg-white/97 dark:bg-gray-900/97 backdrop-blur rounded-t-[28px] border-t border-gray-200 dark:border-gray-800 shadow-2xl flex flex-col`}
                    >
                        <div className="px-4 pt-2 pb-3 border-b border-gray-200 dark:border-gray-800">
                            <div className="mx-auto w-12 h-1.5 rounded-full bg-gray-300 dark:bg-gray-700 mb-3"></div>
                            <div className="flex items-center justify-between gap-2">
                                <div className="flex gap-2 text-xs">
                                    <button onClick={() => setSheetState("collapsed")} className={`px-3 py-1.5 rounded-lg ${sheetState === "collapsed" ? "bg-primary text-white" : "bg-gray-100 dark:bg-gray-800"}`}>Min</button>
                                    <button onClick={() => setSheetState("half")} className={`px-3 py-1.5 rounded-lg ${sheetState === "half" ? "bg-primary text-white" : "bg-gray-100 dark:bg-gray-800"}`}>Mid</button>
                                    <button onClick={() => setSheetState("full")} className={`px-3 py-1.5 rounded-lg ${sheetState === "full" ? "bg-primary text-white" : "bg-gray-100 dark:bg-gray-800"}`}>Max</button>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={clearRoute} className="px-3 py-1.5 text-xs rounded-lg bg-gray-100 dark:bg-gray-800">{t.mapClearRoute}</button>
                                    {locationPermission === "granted" && route && (
                                        <button onClick={reroute} className="px-3 py-1.5 text-xs rounded-lg bg-primary text-white">{t.mapReroute}</button>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="p-4 overflow-y-auto text-start space-y-4">
                            <div>
                                <input
                                    className="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 px-3 py-2 text-sm"
                                    placeholder={t.mapSearchDestination}
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                                {searchResults.length > 0 && (
                                    <div className="mt-2 max-h-32 overflow-y-auto rounded-xl border border-gray-200 dark:border-gray-700">
                                        {searchResults.map((place) => (
                                            <button
                                                key={place.id}
                                                onClick={() => selectDestination(place)}
                                                className="w-full text-start px-3 py-2 border-b last:border-b-0 border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800"
                                            >
                                                <div className="text-sm font-semibold">{place.name}</div>
                                                <div className="text-xs text-gray-500">{place.type} • {place.campus}</div>
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="flex gap-2">
                                <button
                                    onClick={useMyLocationAsOrigin}
                                    className={`px-3 py-2 rounded-lg text-sm ${originMode === "gps" ? "bg-primary text-white" : "bg-gray-100 dark:bg-gray-800"}`}
                                >
                                    {t.mapUseMyLocation}
                                </button>
                                <button
                                    onClick={() => setOriginMode("manual")}
                                    className={`px-3 py-2 rounded-lg text-sm ${originMode === "manual" ? "bg-primary text-white" : "bg-gray-100 dark:bg-gray-800"}`}
                                >
                                    {t.mapSelectManualOrigin}
                                </button>
                            </div>

                            {originMode === "manual" && (
                                <div>
                                    <input
                                        className="w-full rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 px-3 py-2 text-sm"
                                        placeholder={t.mapSearchOrigin}
                                        value={originSearchQuery}
                                        onChange={(e) => setOriginSearchQuery(e.target.value)}
                                    />
                                    <p className="text-xs text-gray-500 mt-1">{t.mapTapMapOrigin}</p>
                                    {originSearchResults.length > 0 && (
                                        <div className="mt-2 max-h-28 overflow-y-auto rounded-xl border border-gray-200 dark:border-gray-700">
                                            {originSearchResults.map((place) => (
                                                <button
                                                    key={place.id}
                                                    onClick={() => selectManualOrigin(place)}
                                                    className="w-full text-start px-3 py-2 border-b last:border-b-0 border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800"
                                                >
                                                    <div className="text-sm font-semibold">{place.name}</div>
                                                    <div className="text-xs text-gray-500">{place.type} • {place.campus}</div>
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            <div className="flex gap-2">
                                {[
                                    { key: "foot", label: t.mapProfileFoot },
                                    { key: "cycling", label: t.mapProfileCycling },
                                    { key: "driving", label: t.mapProfileDriving }
                                ].map((p) => (
                                    <button
                                        key={p.key}
                                        onClick={() => setProfile(p.key)}
                                        className={`px-3 py-2 rounded-lg text-sm ${profile === p.key ? "bg-primary text-white" : "bg-gray-100 dark:bg-gray-800"}`}
                                    >
                                        {p.label}
                                    </button>
                                ))}
                            </div>

                            <button
                                onClick={() => requestDirections()}
                                disabled={loadingRoute}
                                className="w-full h-11 rounded-xl bg-primary text-white font-semibold disabled:opacity-50"
                            >
                                {loadingRoute ? "..." : t.mapGetDirections}
                            </button>

                            {routeError && <div className="text-sm text-red-600 dark:text-red-400">{routeError}</div>}

                            {route && (
                                <div className="space-y-3">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="p-3 rounded-xl bg-gray-50 dark:bg-gray-800">
                                            <div className="text-xs text-gray-500">{t.mapDistance}</div>
                                            <div className="text-lg font-bold">{formatDistance(route.distance_m)}</div>
                                        </div>
                                        <div className="p-3 rounded-xl bg-gray-50 dark:bg-gray-800">
                                            <div className="text-xs text-gray-500">{t.mapEta}</div>
                                            <div className="text-lg font-bold">{formatDuration(route.duration_s)}</div>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="font-semibold mb-2">{t.mapSteps}</div>
                                        {Array.isArray(route.steps) && route.steps.length > 0 ? (
                                            <div className="space-y-2">
                                                {route.steps.map((step, idx) => (
                                                    <div key={idx} className="p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
                                                        <div className="text-sm">{step.instruction}</div>
                                                        <div className="text-xs text-gray-500 mt-1">
                                                            {formatDistance(step.distance_m)} • {formatDuration(step.duration_s)}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        ) : (
                                            <div className="text-sm text-gray-500">{t.mapNoSteps}</div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    <BottomNav active="map" />
                </div>
            );
        };

        const ServicesPage = () => {
            const t = useT();
            const cards = ["IT Services", "Housing", "Health & Wellbeing", "Academic Registry", "Careers", "Student Support"];
            return (
                <div className="min-h-screen pb-24">
                    <Header />
                    <main className="max-w-[960px] mx-auto px-4 py-8">
                        <h2 className="text-3xl font-black">{t.servicesTitle}</h2>
                        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-6">
                            {cards.map((card) => (
                                <div key={card} className="p-4 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700">{card}</div>
                            ))}
                        </div>
                    </main>
                    <BottomNav active="services" />
                </div>
            );
        };

        const EventsPage = () => {
            const t = useT();
            const items = ["Freshers Mixer", "Study Skills Workshop", "Club Fair", "Career Networking"];
            return (
                <div className="min-h-screen pb-24">
                    <Header />
                    <main className="max-w-[960px] mx-auto px-4 py-8">
                        <h2 className="text-3xl font-black">{t.eventsTitle}</h2>
                        <div className="space-y-3 mt-6">
                            {items.map((item) => (
                                <div key={item} className="p-4 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700">{item}</div>
                            ))}
                        </div>
                    </main>
                    <BottomNav active="events" />
                </div>
            );
        };

        const OnboardingPage = () => {
            const navigate = useNavigate();
            const t = useT();
            const {
                uiLanguage,
                autoDetectEnabled,
                activeLanguage,
                setLanguage,
                toggleAutoDetect,
                sessionDetectedLanguage
            } = useLanguage();
            const getLangLabel = (langId) => {
                const match = LANG_OPTIONS.find((l) => l.id === langId);
                return match ? match.label : langId;
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="w-full max-w-[640px] bg-white dark:bg-gray-900 rounded-2xl shadow-xl p-6 border border-gray-200 dark:border-gray-800">
                        <h2 className="text-2xl font-bold">{t.onboardingTitle}</h2>
                        <p className="text-sm text-gray-500 mt-1">{t.onboardingSubtitle}</p>

                        <div className="mt-5 p-3 rounded-lg bg-gray-50 dark:bg-gray-800 text-sm">
                            <div><span className="font-semibold">{t.activeLanguage}:</span> {getLangLabel(activeLanguage)}</div>
                            <div className="mt-1"><span className="font-semibold">{t.selectedLanguage}:</span> {getLangLabel(uiLanguage)}</div>
                            {sessionDetectedLanguage && autoDetectEnabled && (
                                <div className="mt-1 text-primary">Auto-detected this session: {getLangLabel(sessionDetectedLanguage)}</div>
                            )}
                        </div>

                        <div className="mt-4 space-y-3">
                            {LANG_OPTIONS.map((lang) => (
                                <label key={lang.id} className={`flex items-center gap-3 p-3 border-2 rounded-xl cursor-pointer ${activeLanguage === lang.id ? "border-primary bg-primary/5" : "border-gray-200 dark:border-gray-700"}`}>
                                    <input type="radio" checked={uiLanguage === lang.id} onChange={() => setLanguage(lang.id)} />
                                    <span className="font-medium">{lang.label}</span>
                                    {activeLanguage === lang.id && <span className="text-xs text-primary ml-auto">Active</span>}
                                </label>
                            ))}
                        </div>

                        <label className="mt-5 flex items-center gap-3 p-3 rounded-xl bg-gray-50 dark:bg-gray-800 cursor-pointer">
                            <input type="checkbox" checked={autoDetectEnabled} onChange={toggleAutoDetect} />
                            <span className="text-sm">{t.autoDetect}</span>
                        </label>

                        <button onClick={() => navigate("/")} className="mt-6 w-full h-11 rounded-xl bg-primary text-white font-bold">
                            {t.confirm}
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            return (
                <LanguageProvider>
                    <Routes>
                        <Route path="/" element={<HomePage />} />
                        <Route path="/chat" element={<ChatPage />} />
                        <Route path="/map" element={<MapPage />} />
                        <Route path="/services" element={<ServicesPage />} />
                        <Route path="/events" element={<EventsPage />} />
                        <Route path="/onboarding" element={<OnboardingPage />} />
                    </Routes>
                </LanguageProvider>
            );
        };

        const root = createRoot(document.getElementById("root"));
        root.render(
            <MemoryRouter>
                <App />
            </MemoryRouter>
        );
    </script>
</body>
</html>
