    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

        rel="stylesheet"

    />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Lexend", "Noto Sans Arabic", "sans-serif"]
                    },
                },
            },
        }

    <style>
        html, body, #root { height: 100%; margin: 0; }
        body { font-family: 'Lexend', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        :focus-visible { outline: 3px solid #135bec; outline-offset: 3px; }
        html.dark { color-scheme: dark; background: #101622; color: #f3f4f6; }
        @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
        /* Map */
        .map-root { position: fixed; inset: 0; display: flex; flex-direction: column; }
        .map-body { flex: 1; position: relative; display: flex; }
        .map-canvas { flex: 1; position: relative; }
        #map-el { position: absolute; inset: 0; }

        /* Leaflet */
        .leaflet-container { direction: ltr; font-family: 'Lexend', sans-serif; }
        .leaflet-control-zoom { border: none !important; box-shadow: 0 2px 12px rgba(0,0,0,.15) !important; border-radius: 14px !important; overflow: hidden; }
        .leaflet-control-zoom a { width: 40px !important; height: 40px !important; line-height: 40px !important; font-size: 18px !important; border-bottom: 1px solid #f0f0f0 !important; }
        .leaflet-popup-content-wrapper { border-radius: 14px !important; box-shadow: 0 4px 24px rgba(0,0,0,.15) !important; font-family: 'Lexend', sans-serif !important; }
        .leaflet-popup-tip { display: none !important; }

        /* Side panel */
        .map-panel {
            width: 340px; flex-shrink: 0;
            display: flex; flex-direction: column;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-right: 1px solid rgba(0,0,0,0.06);
            box-shadow: 2px 0 20px rgba(0,0,0,.06);
            overflow-y: auto; overflow-x: hidden; z-index: 10;
        }

        /* FABs */
        .map-fab {
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 10px rgba(0,0,0,.18);
            cursor: pointer; border: none; outline: none;
            transition: transform .12s, box-shadow .12s;
        }
        .map-fab:active { transform: scale(.9); }

        /* Search input */
        .map-search-input {
            flex: 1; border: none; outline: none; background: transparent;
            font-size: 14px; font-family: 'Lexend', sans-serif; color: #111827;
            appearance: none; -webkit-appearance: none;
            box-shadow: none; border-radius: 0;
        }
        .map-search-input::placeholder { color: #9ca3af; }
        .map-search-input:focus,
        .map-search-input:focus-visible,
        .map-search-input:active {
            outline: none;
            border: none;
            box-shadow: none;
        }

        /* Transport pills */
        .transport-pill {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 14px; border-radius: 50px;
            border: 1.5px solid #e5e7eb; cursor: pointer;
            background: #fff;
            font-family: 'Lexend', sans-serif; font-size: 12px; font-weight: 600;
            color: #6b7280; transition: all .15s; white-space: nowrap;
        }
        .transport-pill.active { background: #eef2ff; border-color: #135bec; color: #135bec; }

        /* Chip */
        .map-chip {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 7px 14px; border-radius: 50px; border: none; cursor: pointer;
            font-family: 'Lexend', sans-serif; font-size: 12px; font-weight: 600;
            transition: opacity .15s;
        }

        /* Nav HUD */
        .nav-hud {
            position: absolute; top: 14px; left: 14px; right: 14px; z-index: 500;
            background: rgba(19, 91, 236, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(19,91,236,.35);
            padding: 14px 18px; color: #fff;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        :root { --page: #f7f8fc; --ink: #17233d; --muted: #53627b; --surface: #fff; --line: #e0e6ef; }
        html.dark { --page: #101622; --ink: #f2f5fc; --muted: #b3c0d4; --surface: #1b2538; --line: #34415a; }
        body { background: var(--page); color: var(--ink); }
        a,button,summary { -webkit-tap-highlight-color: transparent; }
        button,select,summary { min-height: 44px; }
        ::selection { background: #c9dcff; color: #17233d; }
        .discovery-main { max-width: 1120px; margin: auto; padding: 32px 24px; }
        .campus-hero { display:grid; grid-template-columns: 1fr 1fr; background:var(--surface); border-radius:24px; overflow:hidden; min-height:380px; }
        .hero-copy { padding:40px; align-self:center; }
        .campus-badge { display:inline-flex; align-items:center; gap:6px; text-transform:capitalize; font-size:13px; color:#2454a4; background:#e9f0ff; padding:6px 12px; border-radius:24px; }
        .campus-badge .material-symbols-outlined { font-size:16px; }
        .hero-copy h2 { font-size:clamp(30px,4vw,46px); font-weight:800; line-height:1.13; letter-spacing:-.035em; margin:20px 0 16px; }
        .hero-copy p { color:var(--muted); font-size:16px; line-height:1.7; }
        .primary-action { display:inline-flex; align-items:center; gap:12px; padding:14px 20px; background:#135bec; color:white; border-radius:12px; margin:24px 0 16px; font-weight:600; }
        .hero-copy .hero-note { font-size:12px; }
        .hero-photo { position:relative; min-height:300px; }
        .hero-photo img { width:100%; height:100%; object-fit:cover; position:absolute; }
        .photo-caption { position:absolute; bottom:20px; left:20px; padding:8px 12px; background:#fff; color:#17233d; border-radius:8px; font-size:12px; }
        .section-heading { display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin:36px 0 18px; }
        .section-heading h2 { font-size:23px; font-weight:700; letter-spacing:-.025em; }
        .section-heading p { font-size:14px; color:var(--muted); }
        .explore-grid { display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:18px; }
        .explore-card { background:var(--surface); border-radius:16px; overflow:hidden; transition:transform .2s,box-shadow .2s; }
        .explore-card:hover { transform:translateY(-3px); box-shadow:0 12px 28px #12275212; }
        .explore-copy { padding:22px; }
        .explore-copy h3 { font-size:19px; font-weight:700; }
        .explore-copy p { color:var(--muted); font-size:14px; line-height:1.65; margin:10px 0 18px; }
        .explore-copy>span { color:#135bec; font-size:13px; font-weight:600; }
        .map-art { height:150px; background:#dfebe6; background-image:linear-gradient(34deg,transparent 43%,#fff 44%,#fff 49%,transparent 50%),linear-gradient(110deg,transparent 50%,#fff 51%,#fff 58%,transparent 59%); display:flex; align-items:center; justify-content:center; gap:5px; color:#135bec; }
        .map-art>.material-symbols-outlined { font-size:48px; font-variation-settings:'FILL' 1; }
        .map-art-label { background:white; padding:8px; border-radius:8px; font-size:12px; }
        .card-symbol { display:flex; height:150px; align-items:center; justify-content:center; background:#ede8fa; color:#65529a; font-size:62px; }
        .events-explore>img { width:100%; height:150px; object-fit:cover; }
        .discovery-footer { display:flex; flex-wrap:wrap; justify-content:space-between; gap:16px; margin:28px 0 12px; font-size:11px; color:var(--muted); }
        .discovery-footer details { max-width:480px; }
        .discovery-footer summary { cursor:pointer; }
        @media(max-width:640px) {
            .discovery-main { padding:18px 16px 32px; }
            .campus-hero { grid-template-columns:1fr; border-radius:18px; }
            .hero-copy { padding:26px 24px; }
            .hero-photo { min-height:210px; grid-row:1; }
            .hero-copy h2 { margin-top:16px; }
            .section-heading { display:block; margin-top:28px; }
            .section-heading p { margin-top:6px; }
            .explore-grid { grid-template-columns:1fr; gap:14px; }
            .explore-card { display:grid; grid-template-columns:112px 1fr; }
            .map-art,.card-symbol,.events-explore>img { height:100%; min-height:170px; }
            .map-art { flex-direction:column; }
            .explore-copy { padding:18px; }
            header>div { flex-wrap:wrap; gap:8px; }
            nav { padding-bottom:max(6px,env(safe-area-inset-bottom)) !important; }
        }
        .map-body { min-height:0; }
        @media(max-width:640px) {
            .map-body { flex-direction:column; }
            .map-panel { width:100%; max-height:38dvh; flex-shrink:0; border-right:0; box-shadow:none; border-bottom:1px solid #e0e6ef; }
            .map-canvas { width:100%; min-height:240px; flex:1; }
            .map-root { padding-bottom:calc(58px + env(safe-area-inset-bottom)); }
        }
        .resource-banner { display:flex; justify-content:space-between; align-items:center; gap:24px; background:var(--surface); border-radius:20px; overflow:hidden; }
        .resource-banner>div { padding:28px; }
        .resource-banner h2 { margin-top:12px; line-height:1.2; }
        .resource-banner img { width:40%; height:210px; object-fit:cover; }
        .resource-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; margin-top:28px; }
        .resource-card { background:var(--surface); border-radius:16px; padding:24px; min-width:0; }
        .event-card { display:flex; gap:18px; }
        .event-date { flex-shrink:0; width:62px; height:94px; border-radius:12px; background:#eaf0ff; color:#244f9e; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; }
        .event-date strong { font-size:30px; line-height:1.2; }
        .resource-content { min-width:0; }
        .resource-content h3 { font-size:17px; line-height:1.45; font-weight:700; overflow-wrap:anywhere; }
        .event-time,.event-venue { display:flex; gap:6px; align-items:flex-start; color:var(--muted); font-size:12px; line-height:1.7; margin-top:12px; }
        .event-time .material-symbols-outlined,.event-venue .material-symbols-outlined { font-size:17px; flex-shrink:0; margin-top:2px; }
        .resource-actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:18px; align-items:center; font-size:12px; }
        .resource-actions>a:first-child { background:#135bec; color:white; padding:10px 14px; border-radius:9px; }
        .resource-actions>a:last-child,.service-action { color:#135bec; text-decoration:underline; text-underline-offset:3px; }
        .service-icon { width:52px; height:52px; border-radius:14px; display:grid; place-items:center; margin-bottom:20px; background:#e5efff; color:#2454a4; }
        .tone-1 { background:#ede8fa; color:#65529a; }.tone-2 { background:#e2f0e9; color:#286c50; }
        .service-preview { color:var(--muted); font-size:13px; line-height:1.7; margin:12px 0; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
        .service-card details { font-size:13px; color:var(--muted); margin:12px 0; }.service-card summary { cursor:pointer; }.service-card details p { line-height:1.7; }
        .service-action { display:inline-flex; align-items:center; min-height:44px; font-size:13px; gap:8px; }
        @media(max-width:640px) { .resource-grid { grid-template-columns:1fr; gap:14px; }.resource-banner>div { padding:22px; }.resource-banner img { width:30%; height:190px; }.resource-card { padding:20px; }.event-card { gap:14px; } }
        .chat-starters { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:8px 0; }
        .chat-starters button { display:flex; flex-direction:column; align-items:flex-start; gap:12px; text-align:start; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:14px; padding:16px; font-size:12px; line-height:1.5; }
        .chat-starters .material-symbols-outlined { color:#135bec; background:#eaf0ff; border-radius:10px; padding:8px; }
        .chat-starters button:hover { border-color:#135bec; }
    </style>
</head>

        const LANG_OPTIONS = [
            { id: "en", label: "English" },
            { id: "zh-Hans", label: "简体中文" },
            { id: "hi", label: "हिन्दी" },
            { id: "ar", label: "العربية" },
        ];

        const LanguageContext = createContext(null);

        const readStoredLang = () => {
            try {
                const value = localStorage.getItem(STORAGE_UI_LANG) || "en";
                return SUPPORTED_LANGS.includes(value) ? value : "en";
            } catch (e) {
                return "en";
            }
        };

        const readStoredAutoDetect = () => {
            try {
                const value = localStorage.getItem(STORAGE_AUTO_DETECT);
                return value === null ? false : value === "true";
            } catch (e) {
                return false;
            }
        };

        const LanguageProvider = ({ children }) => {
            const [uiLanguage, setUiLanguage] = useState(readStoredLang);
            const [autoDetectEnabled, setAutoDetectEnabled] = useState(readStoredAutoDetect); // default false: respect explicit language selection
            const [sessionDetectedLanguage, setSessionDetectedLanguageState] = useState(null);

            const activeLanguage = autoDetectEnabled && sessionDetectedLanguage
                ? sessionDetectedLanguage
                : uiLanguage;

            useEffect(() => {
                try { localStorage.setItem(STORAGE_UI_LANG, uiLanguage); } catch (e) {}
            }, [uiLanguage]);

            useEffect(() => {
                try { localStorage.setItem(STORAGE_AUTO_DETECT, String(autoDetectEnabled)); } catch (e) {}
            }, [autoDetectEnabled]);

            useEffect(() => {
                document.documentElement.lang = activeLanguage;
                document.documentElement.dir = activeLanguage === "ar" ? "rtl" : "ltr";
            }, [activeLanguage]);

            const setLanguage = (lang) => {
                if (!SUPPORTED_LANGS.includes(lang)) return;
                setUiLanguage(lang);
                setSessionDetectedLanguageState(null);
            };

            const toggleAutoDetect = () => {
                setAutoDetectEnabled((prev) => {
                    const next = !prev;
                    if (!next) {
                        setSessionDetectedLanguageState(null);
                    }
                    return next;
                });
            };

            const setSessionDetectedLanguage = (lang) => {
                if (!autoDetectEnabled || !SUPPORTED_LANGS.includes(lang)) return;
                setSessionDetectedLanguageState(lang);
            };

            const value = useMemo(() => ({
                uiLanguage,
                autoDetectEnabled,
                sessionDetectedLanguage,
                activeLanguage,
                setLanguage,
                toggleAutoDetect,
                setSessionDetectedLanguage,
            }), [uiLanguage, autoDetectEnabled, sessionDetectedLanguage, activeLanguage]);

            return <LanguageContext.Provider value={value}>{children}</LanguageContext.Provider>;

        const useLanguage = () => useContext(LanguageContext);

        const CampusPhoto = ({campus, className = "", decorative = false}) => <img className={className} src={`/images/campus/${campus}.webp`} alt={decorative ? "" : campus === "orkney" ? "Skara Brae in Orkney" : `${campus.replaceAll("-", " ").replace(/^./, c => c.toUpperCase())} campus`} loading="lazy" width="1280" height="720"/>;
        const HomePage = () => {
            const t = useT();
            const {campus} = usePreferences();
            return <div className="discovery-page min-h-screen pb-24"><Header/>
                <main className="discovery-main">
