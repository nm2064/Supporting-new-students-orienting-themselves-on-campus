                        <Link to="/map" className="explore-card map-explore"><div className="map-art" aria-hidden="true"><span className="material-symbols-outlined">location_on</span><span className="map-art-label">You are here</span></div><div className="explore-copy"><h3>Explore campus</h3><p>Find a building. Plan your route. Feel your way around.</p><span>{t.navMap} ↗</span></div></Link>
                        <Link to="/services" className="explore-card support-explore"><span className="card-symbol material-symbols-outlined" aria-hidden="true">volunteer_activism</span><div className="explore-copy"><h3>{t.navServices}</h3><p>From study support to wellbeing, find the right people.</p><span>Find support ↗</span></div></Link>
                        <Link to="/events" className="explore-card events-explore"><CampusPhoto campus={campus} decorative/><div className="explore-copy"><h3>{t.navEvents}</h3><p>Meet people and find something to look forward to.</p><span>See what’s on ↗</span></div></Link>
                    </section>
                    <footer className="discovery-footer"><span>Campus photography: Heriot-Watt University</span><details><summary>Privacy & your conversation</summary><p>Messages are sent to our server and AI provider, and may be translated by an external service. Server conversations expire after 30 minutes of inactivity. Reloading starts a new conversation. Avoid sharing sensitive personal information. Provider policies also apply.</p></details></footer>
                </main><BottomNav active="home"/></div>;
        };

        const STORAGE_CHAT_MESSAGES = "unibot_chat_messages";
        const STORAGE_CHAT_FOLLOWUPS = "unibot_chat_followups";
        const STORAGE_CONVERSATION_ID = "unibot_conversation_id";

        // Every page load (reload or new visit) starts a new conversation:
        // forget the saved transcript and ask the server for a fresh session
        // so it drops the previous history. The transcript is still kept in
        // localStorage while moving between pages within this load.
        try {
            localStorage.removeItem(STORAGE_CHAT_MESSAGES);
            localStorage.removeItem(STORAGE_CHAT_FOLLOWUPS);
            localStorage.removeItem(STORAGE_CONVERSATION_ID);
        } catch (e) {}
        const newConversationReady = fetch(`${API_BASE}/reset-chat`, { method: "POST" }).catch(() => null);

        // ---- Answer rendering: a small, safe Markdown subset -------------------
        // Builds React elements only (never raw HTML). Links are rendered only
        // for http(s) URLs. [n] markers link to citation n.

        const isWebUrl = (value) => typeof value === "string" && /^https?:\/\//i.test(value);

        const citationUrl = (citation) => citation ? (citation.url || citation.source_url || citation.source || "") : "";

        const citationTitle = (citation, index) => {
            const title = citation && citation.title;
            if (title && title !== citationUrl(citation)) return title;
            const url = citationUrl(citation);
            if (isWebUrl(url)) {
                try {
                    const parsed = new URL(url);
                    return parsed.hostname.replace(/^www\./, "") + parsed.pathname.replace(/\/$/, "");
                } catch (e) {}
            }
            return `Source ${index + 1}`;
        };

        const findCitation = (citations, number) => {
            const list = citations || [];
            const exact = list.find((c) => c && c.number === number);
            return exact || (list[number - 1] && list[number - 1].number === undefined ? list[number - 1] : null);
        };

        const INLINE_PATTERN = /(\*\*[^*]+\*\*|\[[^\]]+\]\((?:https?:\/\/)[^)\s]+\)|\[\d+\]|https?:\/\/[^\s)\]]+)/g;

        const renderInline = (text, citations, keyPrefix) => {
            const parts = String(text).split(INLINE_PATTERN);
            return parts.map((part, i) => {
                const key = `${keyPrefix}-${i}`;
                if (!part) return null;
                if (part.startsWith("**") && part.endsWith("**") && part.length > 4) {
                    return <strong key={key}>{part.slice(2, -2)}</strong>;
                }
                const markdownLink = part.match(/^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)$/i);
                if (markdownLink) {
                    return <a key={key} href={markdownLink[2]} target="_blank" rel="noopener noreferrer" className="text-primary underline break-words">{markdownLink[1]}</a>;
                }
                const marker = part.match(/^\[(\d+)\]$/);
                if (marker) {
                    const number = parseInt(marker[1], 10);
                    const citation = findCitation(citations, number);
                    const url = citationUrl(citation);
                    if (!citation) return <span key={key}>{part}</span>;
                    return isWebUrl(url)
                        ? <a key={key} href={url} target="_blank" rel="noopener noreferrer" title={citationTitle(citation, number - 1)} className="align-super text-[10px] font-semibold text-primary no-underline px-0.5">[{number}]</a>
                        : <sup key={key} className="text-[10px] font-semibold">[{number}]</sup>;
                }
                if (isWebUrl(part)) {
                    return <a key={key} href={part} target="_blank" rel="noopener noreferrer" className="text-primary underline break-all">{part}</a>;
                }
                return <React.Fragment key={key}>{part}</React.Fragment>;
            });
        };

        const tableCells = (line) => line.trim().replace(/^\||\|$/g, "").split("|").map((cell) => cell.trim());

        const AnswerBody = ({ text, citations }) => {
            const blocks = [];
            let list = null;
            let table = null;
            const flushTable = () => {
                if (table) {
                    const [header, ...rows] = table.rows;
                    const keyBase = `t${blocks.length}`;
                    blocks.push(
                        <div key={keyBase} className="overflow-x-auto my-1">
                            <table className="text-xs border-collapse">
                                <thead>
                                    <tr>{header.map((cell, i) => <th key={i} className="border border-gray-300/60 px-2 py-1 text-start font-semibold">{renderInline(cell, citations, `${keyBase}h${i}`)}</th>)}</tr>
                                </thead>
                                <tbody>
                                    {rows.map((row, r) => (
                                        <tr key={r}>{row.map((cell, i) => <td key={i} className="border border-gray-300/60 px-2 py-1 align-top">{renderInline(cell, citations, `${keyBase}r${r}c${i}`)}</td>)}</tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    );
                    table = null;
                }
            };
            const flushList = () => {
                if (list) {
                    const items = list.items;
                    blocks.push(list.ordered
                        ? <ol key={`b${blocks.length}`} className="list-decimal ps-5 space-y-1">{items}</ol>
                        : <ul key={`b${blocks.length}`} className="list-disc ps-5 space-y-1">{items}</ul>);
                    list = null;
                }
            };
            String(text || "").split("\n").forEach((rawLine, lineIndex) => {
                const line = rawLine.trimEnd();
                const key = `l${lineIndex}`;
                if (/^\s*\|.*\|\s*$/.test(line)) {
                    flushList();
                    if (/^\s*\|[\s:|-]+\|\s*$/.test(line)) return; // header separator row
                    if (!table) table = { rows: [] };
                    table.rows.push(tableCells(line));
                    return;
                }
                flushTable();
                const bullet = line.match(/^\s*[-*•]\s+(.*)$/);
                const numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);
                if (bullet || numbered) {
                    const ordered = !!numbered && !bullet;
                    if (!list || list.ordered !== ordered) { flushList(); list = { ordered, items: [] }; }
                    list.items.push(<li key={key}>{renderInline((bullet || numbered)[1], citations, key)}</li>);
                    return;
                }
                flushList();
                const heading = line.match(/^\s*#{1,4}\s+(.*)$/);
                if (heading) {
                    blocks.push(<p key={key} className="font-semibold mt-2">{renderInline(heading[1], citations, key)}</p>);
                } else if (line.trim() === "") {
                    blocks.push(<div key={key} className="h-2" />);
                } else {
                    blocks.push(<p key={key}>{renderInline(line, citations, key)}</p>);
                }
            });
            flushList();
            flushTable();
            return <div className="text-sm leading-relaxed space-y-1 break-words">{blocks}</div>;
        };

        const SourceList = ({ citations, text, labels }) => {
            const list = (citations || []).filter(Boolean);
            if (list.length === 0) return null;
            const citedInline = /\[\d+\]/.test(text || "");
            return (
                <div className="mt-3 border-t border-gray-300/40 pt-2">
                    <p className="text-[11px] uppercase tracking-wide text-gray-500 mb-1">
                        {citedInline ? labels.sources : labels.sourcesConsulted}
                    </p>
                    <ol className="space-y-1">
                        {list.map((citation, index) => {
                            const number = citation.number || index + 1;
                            const url = citationUrl(citation);
                            const title = citationTitle(citation, index);
                            return (
                                <li key={index} className="text-xs flex gap-1.5">
                                    <span className="font-semibold text-gray-500">[{number}]</span>
                                    {isWebUrl(url)
                                        ? <a href={url} target="_blank" rel="noopener noreferrer" className="text-primary underline break-words">{title}</a>
                                        : <span>{title}</span>}
                                </li>
                            );
                        })}
                    </ol>
                </div>
            );
        };

        const ChatPage = () => {
            const t = useT();
            const { uiLanguage, autoDetectEnabled, setSessionDetectedLanguage } = useLanguage();
            const {campus} = usePreferences();

            const [messages, setMessages] = useState(() => {
                try {
                    const stored = localStorage.getItem(STORAGE_CHAT_MESSAGES);
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    }
                } catch (e) {}
                return [{ role: "assistant", text: t.assistantIntro }];
            });

            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const [preview, setPreview] = useState("");
            const [followUps, setFollowUps] = useState(() => {
                try {
                    const stored = localStorage.getItem(STORAGE_CHAT_FOLLOWUPS);
                    if (stored) return JSON.parse(stored);
                } catch (e) {}
                return [];
            });
            const [lastEffectiveLanguage, setLastEffectiveLanguage] = useState(null);
            const [lastConfidence, setLastConfidence] = useState(null);

            useEffect(() => {
                try { localStorage.setItem(STORAGE_CHAT_MESSAGES, JSON.stringify(messages)); } catch (e) {}
            }, [messages]);

            useEffect(() => {
                try { localStorage.setItem(STORAGE_CHAT_FOLLOWUPS, JSON.stringify(followUps)); } catch (e) {}
            }, [followUps]);

            useEffect(() => {
                setMessages((prev) => {
                    if (prev.length === 1 && prev[0].role === "assistant") {
                        return [{ role: "assistant", text: t.assistantIntro }];
                    }
                    return prev;
                });
            }, [t.assistantIntro]);

            const getConversationId = () => {
                let id = localStorage.getItem(STORAGE_CONVERSATION_ID);
                if (!id) {
                    id = (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
                    localStorage.setItem(STORAGE_CONVERSATION_ID, id);
                }
                return id;
            };

            const sendMessage = async () => {
                if (!input.trim() || loading) return;
                const userText = input.trim();
                setInput("");
                setPreview("");
                setLoading(true);
                setMessages((prev) => [...prev, { role: "user", text: userText }]);

                try {
                    // Make sure the server has started the new conversation first.
                    await newConversationReady;
                    const res = await fetch(`${API_BASE}/rag-chat/stream`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: userText,
                            conversation_id: getConversationId(),
                            ui_language: uiLanguage,
                            campus,
                            auto_detect: autoDetectEnabled
                        }),
                    });
                    if (!res.ok) {
                        const message = res.status === 503
                            ? "The AI assistant is being configured. Please check back soon."
                            : res.status === 429
                                ? "The demo has reached its request limit. Please try again later."
                                : "Could not get a response. Please try again.";
                        throw new Error(message);
                    }

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = "", data = null;
                    setPreview("");
                    while (true) {
                        const {value, done} = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, {stream:true});
                        let boundary;
                        while ((boundary = buffer.indexOf("\n\n")) >= 0) {
                            const frame = buffer.slice(0, boundary); buffer = buffer.slice(boundary + 2);
                            const line = frame.split("\n").find(l => l.startsWith("data: "));
                            if (!line) continue;
                            const event = JSON.parse(line.slice(6));
                            if (event.type === "preview") setPreview(event.text);
                            if (event.type === "complete") data = event.response;
                            if (event.type === "error") throw new Error(event.message);
                        }
                    }
                    if (!data) throw new Error("The reply was interrupted. Please try again.");
                    setPreview("");
                    const answer = typeof data.answer_markdown === "string" && data.answer_markdown.trim()
                        ? data.answer_markdown
                        : (typeof data.answer === "string" && data.answer.trim() ? data.answer : "");
                    const clarifyingQuestion = typeof data.clarifying_question === "string" && data.clarifying_question.trim()
                        ? data.clarifying_question
                        : "";
                    const assistantText = answer || clarifyingQuestion;
                    const citations = Array.isArray(data.citations) ? data.citations : (data.sources || []);

                    setMessages((prev) => [...prev, {
                        role: "assistant",
                        text: assistantText || "Sorry, I didn't receive a response. Please try again.",
                        citations: answer ? citations : [],
                        needsHumanHandoff: !!data.needs_human_handoff,
                        clarifyingQuestion: clarifyingQuestion || null,
                    }]);

                    setFollowUps(Array.isArray(data.follow_up_suggestions) ? data.follow_up_suggestions : []);
                    setLastEffectiveLanguage(data.effective_language || null);
                    setLastConfidence(typeof data.confidence === "number" ? data.confidence : null);

                    if (autoDetectEnabled && data.effective_language) {
                        setSessionDetectedLanguage(data.effective_language);
                    }
                } catch (err) {
                    setMessages((prev) => [...prev, { role: "assistant", text: err.message || "Could not connect. Please try again." }]);
                } finally {
                    setLoading(false);
                }
            };

            const clearChat = async () => {
                if (loading) return;
                try {
                    const response = await fetch(`${API_BASE}/reset-chat`, {method: "POST"});
                    if (!response.ok && response.status !== 404) throw new Error("Reset failed");
                } catch (error) {
                    setMessages(prev => [...prev, {role: "assistant", text: "Could not clear the conversation. Please try again."}]);
                    return;
                }
                const initial = [{ role: "assistant", text: t.assistantIntro }];
                setMessages(initial);
                setFollowUps([]);
                try {
                    localStorage.removeItem(STORAGE_CONVERSATION_ID);
                    localStorage.setItem(STORAGE_CHAT_MESSAGES, JSON.stringify(initial));
                    localStorage.removeItem(STORAGE_CHAT_FOLLOWUPS);
                } catch (e) {}
            };

            return (
                <div className="bg-background-light dark:bg-background-dark font-display flex justify-center h-[100dvh] overflow-hidden">
                    <div className="relative w-full max-w-[520px] bg-white dark:bg-gray-900 flex h-full flex-col overflow-hidden pb-16">
                        <div className="flex items-center justify-between px-4 py-3 border-b border-gray-100 dark:border-gray-800 bg-white/95 dark:bg-gray-900/95">
                            <div>
                                <h2 className="font-bold">UniBot</h2>
                                <p className="text-xs text-gray-500">
                                    {lastEffectiveLanguage
                                        ? `Reply language: ${{en: "English", "zh-Hans": "简体中文", hi: "हिन्दी", ar: "العربية"}[lastEffectiveLanguage] || lastEffectiveLanguage}`
                                        : "Heriot-Watt campus assistant"}
                                </p>
                            </div>
                            <SettingsControls /><button onClick={clearChat} className="px-3 py-1.5 text-sm bg-gray-100 dark:bg-gray-800 rounded-lg">{t.clear}</button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-4 text-start">
                            {messages.map((msg, idx) => {
                                const isUser = msg.role === "user";
                                return (
                                    <div key={idx} className={`flex ${isUser ? "justify-end" : "justify-start"}`}>
                                        <div className={`max-w-[85%] rounded-2xl px-4 py-3 ${isUser ? "bg-primary text-white" : "bg-gray-100 dark:bg-gray-800"}`}>
                                            {isUser
                                                ? <div className="whitespace-pre-wrap text-sm leading-relaxed">{msg.text}</div>
                                                : <AnswerBody text={msg.text} citations={msg.citations} />}
                                            {!isUser && msg.needsHumanHandoff && <p className="mt-3 text-sm"><Link className="underline" to="/services">Contact student support for personal guidance</Link></p>}
                                            {!isUser && <Link className="block mt-2 text-xs underline" to={`/map?q=${encodeURIComponent((msg.text.match(/library|Oriam|student union|GRID|Learning Commons/i) || [""])[0])}`}>Find a place on the map</Link>}
                                            {!isUser && (
                                                <SourceList
                                                    citations={msg.citations}
                                                    text={msg.text}
                                                    labels={{ sources: t.sources, sourcesConsulted: t.sourcesConsulted }}
                                                />
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                            {messages.length === 1 && !loading && <div className="chat-starters" aria-label="Conversation starters">{[
                                ["local_library", "Library opening hours", "When is the library open?"],
                                ["explore", "Find my way", "How do I find the main library?"],
                                ["groups", "Meet people", "What student events are coming up?"],
                                ["volunteer_activism", "Get support", "Where can I find student support?"]
                            ].map(([icon,label,question]) => <button key={icon} aria-label={label} onClick={() => setInput(question)}><span className="material-symbols-outlined" aria-hidden="true">{icon}</span><span>{label}</span></button>)}</div>}
                            {loading && preview && <div className="p-3 bg-gray-100 dark:bg-gray-800 rounded-xl"><p className="text-xs mb-2">Draft answer · checking citations</p><p className="whitespace-pre-wrap text-sm">{preview}</p></div>}
                            {loading && <div role="status" className="text-sm text-gray-500">Checking sources and preparing your answer…</div>}
                        </div>

                        {followUps.length > 0 && (
                            <div className="px-4 py-2 border-t border-gray-200 dark:border-gray-800">
                                <p className="text-xs text-gray-500 mb-2">{t.quickQuestions}</p>
                                <div className="flex gap-2 overflow-x-auto hide-scrollbar">
                                    {followUps.map((item, i) => (
                                        <button key={i} onClick={() => setInput(item)} className="px-3 py-1.5 rounded-full bg-gray-100 dark:bg-gray-800 text-xs whitespace-nowrap">{item}</button>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="p-4 border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
                            <div className="flex items-center gap-2 bg-gray-100 dark:bg-gray-800 rounded-2xl px-3 py-2">
                                <input
                                    aria-label="Message to UniBot"
                                    className="flex-1 appearance-none border-0 bg-transparent px-1 py-2 text-sm outline-none shadow-none ring-0 focus:border-0 focus:outline-none focus:ring-0 focus:ring-transparent focus:ring-offset-0 focus:shadow-none"
                                    style={{ boxShadow: "none" }}
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); sendMessage(); }}}
                                    placeholder={t.chatPlaceholder}
                                />
                                <button aria-label="Send message" onClick={sendMessage} disabled={loading || !input.trim()} className="bg-primary text-white w-10 h-10 rounded-xl disabled:opacity-50">
                                    <span className="material-symbols-outlined text-xl">send</span>
                                </button>
                            </div>
                        </div>
                        <BottomNav active="chat" />
                    </div>
                </div>
            );
        };

        const MapPage = () => {
            const t = useT();
            const { activeLanguage } = useLanguage();
            const mapContainerRef = useRef(null);
            const mapRef = useRef(null);
            const destinationMarkerRef = useRef(null);
            const manualOriginMarkerRef = useRef(null);
            const currentMarkerRef = useRef(null);
            const currentAccuracyRef = useRef(null);
            const routeLayerRef = useRef(null);
            const originModeRef = useRef("manual");

            const [searchQuery, setSearchQuery] = useState(() => new URLSearchParams(window.location.search).get("q") || "");
            const {campus} = usePreferences();
            const [searchResults, setSearchResults] = useState([]);
            const [originSearchQuery, setOriginSearchQuery] = useState("");
            const [originSearchResults, setOriginSearchResults] = useState([]);
            const [locationPermission, setLocationPermission] = useState("unknown");
            const [currentLocation, setCurrentLocation] = useState(null);
            const [locationAccuracy, setLocationAccuracy] = useState(null);
            const [originMode, setOriginMode] = useState("manual");
            const [manualOrigin, setManualOrigin] = useState(null);
            const [selectedDestination, setSelectedDestination] = useState(null);
            const [profile, setProfile] = useState("foot");
            const [route, setRoute] = useState(null);
            const [loadingRoute, setLoadingRoute] = useState(false);
            const [routeError, setRouteError] = useState(null);
            const [leafletReady, setLeafletReady] = useState(!!window.L);

            useEffect(() => {
                originModeRef.current = originMode;
            }, [originMode]);

            const localeTag = activeLanguage === "zh-Hans" ? "zh-CN" : activeLanguage;
            const formatDistance = (meters) => {
                if (meters >= 1000) {
                    return `${new Intl.NumberFormat(localeTag, { maximumFractionDigits: 1 }).format(meters / 1000)} km`;
                }
                return `${new Intl.NumberFormat(localeTag, { maximumFractionDigits: 0 }).format(meters)} m`;
            };
            const formatDuration = (seconds) => {
                const totalMin = Math.round(seconds / 60);
                const h = Math.floor(totalMin / 60);
                const m = totalMin % 60;
                if (h > 0) return `${h}h ${m}m`;
                return `${m}m`;
            };

            useEffect(() => {
                if (!mapContainerRef.current || mapRef.current || !window.L) return;
                const map = window.L.map(mapContainerRef.current, {
                    zoomControl: false,   /* we place zoom ourselves below */
                    preferCanvas: true,   /* faster rendering */
                }).setView([55.90985, -3.32015], 16);

                window.L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                    maxZoom: 19,
                    keepBuffer: 1,
                    updateWhenIdle: true,
                    attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors"
                }).addTo(map);

                /* Re-add zoom in a better position */
                window.L.control.zoom({ position: "bottomright" }).addTo(map);

                map.on("click", (event) => {
                    if (originModeRef.current !== "manual") return;
                    const nextOrigin = {
                        lat: event.latlng.lat,
                        lng: event.latlng.lng,
                        name: "Origin"
                    };
                    setManualOrigin(nextOrigin);
                    setOriginSearchQuery(`${nextOrigin.lat.toFixed(5)}, ${nextOrigin.lng.toFixed(5)}`);
                });

                mapRef.current = map;
                setLeafletReady(true);
                /* Let DOM settle then size */
                requestAnimationFrame(() => { map.invalidateSize(); });
                return () => map.remove();
            }, []);


            useEffect(() => {
                if (!mapRef.current) return;
                const onResize = () => mapRef.current && mapRef.current.invalidateSize();
                window.addEventListener("resize", onResize);
                return () => window.removeEventListener("resize", onResize);
            }, []);

            useEffect(() => {
                if (!selectedDestination || !mapRef.current || !window.L) return;
                if (destinationMarkerRef.current) destinationMarkerRef.current.remove();
                destinationMarkerRef.current = window.L.marker(
                    [selectedDestination.lat, selectedDestination.lng],
                    { draggable: true }
                ).addTo(mapRef.current);
                destinationMarkerRef.current.on("dragend", (event) => {
                    const next = event.target.getLatLng();
                    setSelectedDestination((prev) => {
                        if (!prev) return prev;
                        return { ...prev, lat: next.lat, lng: next.lng };
                    });
                });
                destinationMarkerRef.current.bindPopup(`${t.mapDestinationLabel}: ${selectedDestination.name}`).openPopup();
            }, [selectedDestination, activeLanguage]);

            useEffect(() => {
                if (!mapRef.current || !window.L) return;
                if (manualOriginMarkerRef.current) {
                    manualOriginMarkerRef.current.remove();
                    manualOriginMarkerRef.current = null;
                }
                if (originMode === "manual" && manualOrigin) {
                    manualOriginMarkerRef.current = window.L.marker([manualOrigin.lat, manualOrigin.lng]).addTo(mapRef.current);
                    manualOriginMarkerRef.current.bindPopup(`${t.mapOriginPin}`).openPopup();
                }
            }, [originMode, manualOrigin, activeLanguage]);

            useEffect(() => {
                if (!mapRef.current || !window.L) return;
                if (currentMarkerRef.current) currentMarkerRef.current.remove();
                if (currentAccuracyRef.current) currentAccuracyRef.current.remove();
                if (currentLocation) {
                    currentMarkerRef.current = window.L.marker([currentLocation.lat, currentLocation.lng]).addTo(mapRef.current);
                    currentMarkerRef.current.bindPopup(t.mapCurrentLocationLabel);
                    if (locationAccuracy) {
                        currentAccuracyRef.current = window.L.circle([currentLocation.lat, currentLocation.lng], {
                            radius: locationAccuracy,
                            weight: 1,
                            opacity: 0.4,
                            fillOpacity: 0.12
                        }).addTo(mapRef.current);
                    }
                }
            }, [currentLocation, locationAccuracy, activeLanguage]);

            useEffect(() => {
                if (!mapRef.current || !window.L) return;
                if (routeLayerRef.current) {
                    routeLayerRef.current.remove();
                    routeLayerRef.current = null;
                }
                if (route && route.geometry && Array.isArray(route.geometry.coordinates)) {
                    const latlngs = route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
                    if (latlngs.length < 2) return;
                    routeLayerRef.current = window.L.polyline(latlngs, {
                        color: "#135bec",
                        weight: 5,
                        opacity: 0.9
                    }).addTo(mapRef.current);
                    mapRef.current.fitBounds(routeLayerRef.current.getBounds(), { padding: [24, 24] });
                }
            }, [route]);

            useEffect(() => {
                const term = searchQuery.trim();
                if (!term) {
                    setSearchResults([]);
                    return;
                }
                const timeout = setTimeout(async () => {
                    try {
                        const res = await fetch(`${API_BASE}/api/places?campus=${encodeURIComponent(campus)}&query=${encodeURIComponent(term)}`);
                        if (!res.ok) return;
                        const data = await res.json();
                        setSearchResults(Array.isArray(data) ? data : []);
                    } catch (e) {}
                }, 250);
                return () => clearTimeout(timeout);
            }, [searchQuery, campus]);

            useEffect(() => {
                const term = originSearchQuery.trim();
                if (originMode !== "manual" || !term) {
                    setOriginSearchResults([]);
                    return;
                }
                const timeout = setTimeout(async () => {
                    try {
                        const res = await fetch(`${API_BASE}/api/places?campus=${encodeURIComponent(campus)}&query=${encodeURIComponent(term)}`);
                        if (!res.ok) return;
                        const data = await res.json();
                        setOriginSearchResults(Array.isArray(data) ? data : []);
                    } catch (e) {}
                }, 250);
                return () => clearTimeout(timeout);
            }, [originSearchQuery, originMode]);

            const selectDestination = (place) => {
                setSelectedDestination(place);
                setSearchQuery(place.name);
                setSearchResults([]);
                if (mapRef.current) mapRef.current.panTo([place.lat, place.lng]);
            };

            const selectManualOrigin = (place) => {
                setManualOrigin(place);
                setOriginSearchQuery(place.name);
                setOriginSearchResults([]);
                if (mapRef.current) mapRef.current.panTo([place.lat, place.lng]);
            };

            const enableLocation = () => {
                if (!navigator.geolocation) {
                    setLocationPermission("unavailable");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const nextLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            name: t.mapCurrentLocationLabel
                        };
                        setLocationPermission("granted");
                        setCurrentLocation(nextLocation);
                        setLocationAccuracy(position.coords.accuracy || null);
                        setOriginMode("gps");
                        if (mapRef.current) mapRef.current.panTo([nextLocation.lat, nextLocation.lng]);
                    },
                    () => {
                        setLocationPermission("denied");
                        setOriginMode("manual");
                    },
                    { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
                );
            };

            const useMyLocationAsOrigin = () => {
                if (locationPermission === "granted" && currentLocation) {
                    setOriginMode("gps");
                    if (mapRef.current) mapRef.current.panTo([currentLocation.lat, currentLocation.lng]);
                    return;
                }
                enableLocation();
            };

            const requestDirections = async (originOverride = null) => {
                if (!selectedDestination) {
                    setRouteError(t.mapNoDestination);
                    return;
                }
                const origin = originOverride || (originMode === "gps" ? currentLocation : manualOrigin);
                if (!origin) {
                    setRouteError(t.mapNoOrigin);
                    return;
                }

                setLoadingRoute(true);
                setRouteError(null);
                try {
                    const res = await fetch(`${API_BASE}/api/route`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            profile,
                            origin: { lat: origin.lat, lng: origin.lng },
                            destination: { lat: selectedDestination.lat, lng: selectedDestination.lng },
                            locale: activeLanguage
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        setRouteError(data.detail || t.mapRoutingUnavailable);
                        return;
                    }
                    setRoute(data);
                } catch (e) {
                    setRouteError(t.mapRoutingUnavailable);
                } finally {
                    setLoadingRoute(false);
                }
            };

            const reroute = () => {
                if (locationPermission !== "granted" || !currentLocation) return;
                setOriginMode("gps");
                requestDirections(currentLocation);
            };

            const clearRoute = () => {
                setRoute(null);
                setRouteError(null);
            };

            /* ── Nav mode state ── */
            const [navMode, setNavMode] = React.useState(false);
            const [stepIndex, setStepIndex] = useState(0);
            useEffect(() => {setStepIndex(0);}, [route]);

            return (
                <div className="map-root" dir={activeLanguage === "ar" ? "rtl" : "ltr"}>
                    {/* Body = panel + map */}
                    <div className="map-body">

                        {/* ── Side Panel ── */}
                        <div className="map-panel">
                            <div className="hide-scrollbar" style={{ flex: 1, overflowY: "auto", padding: "16px", display: "flex", flexDirection: "column", gap: 12 }}>

                                {/* Search */}
                                <div style={{ display: "flex", alignItems: "center", background: "#f3f4f6", borderRadius: 14, padding: "0 12px", height: 46, gap: 8 }}>
                                    {selectedDestination ? (
                                        <button
                                            onClick={() => { setSelectedDestination(null); setSearchQuery(""); setSearchResults([]); setRoute(null); setRouteError(null); setNavMode(false); }}
                                            style={{ color: "#6b7280", background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center", flexShrink: 0 }}
                                        >
                                            <span className="material-symbols-outlined" style={{ fontSize: 20 }}>arrow_back</span>
                                        </button>
                                    ) : (
                                        <span className="material-symbols-outlined" style={{ fontSize: 18, color: "#9ca3af", flexShrink: 0 }}>search</span>
                                    )}
                                    <input
                                        className="map-search-input"
                                        placeholder={t.mapSearchDestination}
                                        value={searchQuery}
                                        onChange={(e) => { setSearchQuery(e.target.value); setSelectedDestination(null); }}
                                    />
                                    {searchQuery.length > 0 && (
                                        <button onClick={() => { setSearchQuery(""); setSearchResults([]); }} style={{ color: "#9ca3af", background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center", flexShrink: 0 }}>
                                            <span className="material-symbols-outlined" style={{ fontSize: 18 }}>close</span>
                                        </button>
                                    )}
                                </div>

                                {/* Search results */}
                                {!selectedDestination && searchResults.length > 0 && (
                                    <div style={{ borderRadius: 14, border: "1px solid #e5e7eb", background: "#fff", overflow: "hidden" }}>
                                        {searchResults.map((place, i) => (
                                            <button
                                                key={place.id}
                                                onClick={() => selectDestination(place)}
                                                style={{
                                                    width: "100%", textAlign: "start", padding: "11px 14px",
                                                    background: "none", border: "none",
                                                    borderBottom: i < searchResults.length - 1 ? "1px solid #f3f4f6" : "none",
                                                    cursor: "pointer", fontFamily: "inherit",
                                                    display: "flex", alignItems: "center", gap: 10,
                                                }}
                                                onMouseEnter={(e) => e.currentTarget.style.background = "#f9fafb"}
                                                onMouseLeave={(e) => e.currentTarget.style.background = "none"}
                                            >
                                                <span className="material-symbols-outlined" style={{ fontSize: 16, color: "#9ca3af", flexShrink: 0 }}>place</span>
                                                <div>
                                                    <div style={{ fontSize: 13, fontWeight: 600, color: "#111827" }}>{place.name}</div>
                                                    <div style={{ fontSize: 11, color: "#6b7280" }}>{place.type} &bull; {place.campus}</div>
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* Welcome state */}
                                {!selectedDestination && searchResults.length === 0 && (
                                    <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8, padding: "40px 0", opacity: 0.5 }}>
                                        <span className="material-symbols-outlined" style={{ fontSize: 48, color: "#9ca3af" }}>explore</span>
                                        <div style={{ fontSize: 14, color: "#6b7280", textAlign: "center" }}>Search for a campus building to get started</div>
                                    </div>
                                )}

                                {/* Destination selected */}
                                {selectedDestination && (
                                    <React.Fragment>
                                        {/* Destination header */}
                                        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "4px 0" }}>
                                            <div style={{ width: 40, height: 40, borderRadius: "50%", background: "#eef2ff", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                                                <span className="material-symbols-outlined" style={{ fontSize: 20, color: "#135bec" }}>place</span>
                                            </div>
                                            <div style={{ flex: 1 }}>
                                                <div style={{ fontSize: 15, fontWeight: 700, color: "#111827" }}>{selectedDestination.name}</div>
                                                {selectedDestination.campus && <div style={{ fontSize: 12, color: "#6b7280", marginTop: 1 }}>{selectedDestination.campus}</div>}
                                            </div>
                                        </div>

                                        {/* Transport pills */}
                                        <div style={{ display: "flex", gap: 8 }}>
                                            {[
                                                { key: "foot",    icon: "directions_walk", label: t.mapProfileFoot },
                                                { key: "cycling", icon: "pedal_bike",      label: t.mapProfileCycling },
                                                { key: "driving", icon: "directions_car",  label: t.mapProfileDriving },
                                            ].map((p) => (
                                                <button key={p.key} onClick={() => setProfile(p.key)}
                                                    className={"transport-pill" + (profile === p.key ? " active" : "")}
                                                >
                                                    <span className="material-symbols-outlined" style={{ fontSize: 18 }}>{p.icon}</span>
                                                    {p.label}
                                                </button>
                                            ))}
                                        </div>

                                        {/* Origin toggle */}
                                        <div style={{ display: "flex", background: "#f3f4f6", borderRadius: 12, padding: 3 }}>
                                            {[
                                                { mode: "gps",    icon: "my_location", label: t.mapUseMyLocation,      action: useMyLocationAsOrigin },
                                                { mode: "manual", icon: "place",       label: t.mapSelectManualOrigin, action: () => setOriginMode("manual") },
                                            ].map(({ mode, icon, label, action }) => (
                                                <button key={mode} onClick={action}
                                                    style={{
                                                        flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                                                        padding: "9px 8px", fontSize: 12, fontWeight: 500,
                                                        borderRadius: 10, border: "none", cursor: "pointer", fontFamily: "inherit",
                                                        background: originMode === mode ? "#fff" : "transparent",
                                                        color: originMode === mode ? "#135bec" : "#6b7280",
                                                        boxShadow: originMode === mode ? "0 1px 4px rgba(0,0,0,.08)" : "none",
                                                        transition: "all .15s",
                                                    }}
                                                >
                                                    <span className="material-symbols-outlined" style={{ fontSize: 15 }}>{icon}</span>
                                                    {label}
                                                </button>
                                            ))}
                                        </div>

                                        {/* Manual origin */}
                                        {originMode === "manual" && (
                                            <div>
                                                <div style={{ display: "flex", alignItems: "center", background: "#f9fafb", border: "1.5px solid #e5e7eb", borderRadius: 12, padding: "0 12px", height: 42, gap: 8 }}>
                                                    <span className="material-symbols-outlined" style={{ fontSize: 16, color: "#135bec" }}>trip_origin</span>
                                                    <input
                                                        className="map-search-input"
                                                        style={{ fontSize: 13 }}
                                                        placeholder={t.mapSearchOrigin}
                                                        value={originSearchQuery}
                                                        onChange={(e) => setOriginSearchQuery(e.target.value)}
                                                    />
                                                </div>
                                                <div style={{ fontSize: 11, color: "#9ca3af", marginTop: 4 }}>{t.mapTapMapOrigin}</div>
                                                {originSearchResults.length > 0 && (
                                                    <div style={{ marginTop: 4, borderRadius: 12, border: "1px solid #e5e7eb", background: "#fff", overflow: "hidden" }}>
                                                        {originSearchResults.map((place) => (
                                                            <button key={place.id} onClick={() => selectManualOrigin(place)}
                                                                style={{ width: "100%", textAlign: "start", padding: "9px 12px", border: "none", borderBottom: "1px solid #f3f4f6", background: "none", cursor: "pointer", fontFamily: "inherit" }}
                                                            >
                                                                <div style={{ fontSize: 13, fontWeight: 600, color: "#111827" }}>{place.name}</div>
                                                                <div style={{ fontSize: 11, color: "#6b7280" }}>{place.type}</div>
                                                            </button>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* Get Directions */}
                                        <div style={{ display: "flex", gap: 8 }}>
                                            <button
                                                onClick={() => requestDirections()}
                                                disabled={loadingRoute}
                                                style={{
                                                    flex: 1, height: 44, borderRadius: 22, border: "none",
                                                    cursor: loadingRoute ? "not-allowed" : "pointer",
                                                    background: "#135bec", color: "#fff",
                                                    fontFamily: "inherit", fontWeight: 700, fontSize: 14,
                                                    boxShadow: "0 3px 12px rgba(19,91,236,.28)",
                                                    opacity: loadingRoute ? .65 : 1,
                                                    display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                                                }}
                                            >
                                                {loadingRoute
                                                    ? React.createElement(React.Fragment, null, React.createElement("span", {className:"material-symbols-outlined", style:{fontSize:18, animation:"spin 1s linear infinite"}}, "progress_activity"), " Loading\u2026")
                                                    : React.createElement(React.Fragment, null, React.createElement("span", {className:"material-symbols-outlined", style:{fontSize:18}}, "directions"), t.mapGetDirections)}
                                            </button>
                                            {locationPermission === "granted" && route && (
                                                <button onClick={reroute} className="map-chip" style={{ background: "#eef2ff", color: "#135bec" }}>
                                                    <span className="material-symbols-outlined" style={{ fontSize: 16 }}>refresh</span>
                                                </button>
                                            )}
                                        </div>

                                        {/* Route error */}
                                        {routeError && (
                                            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 12px", background: "#fef2f2", borderRadius: 10, color: "#b91c1c", fontSize: 13 }}>
                                                <span className="material-symbols-outlined" style={{ fontSize: 16 }}>error</span>
                                                {routeError}
                                            </div>
                                        )}

                                        {/* Route result */}
                                        {route && (
                                            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                                                {/* ETA card */}
                                                <div style={{
                                                    display: "flex", alignItems: "center", justifyContent: "space-between",
                                                    padding: "14px 18px", borderRadius: 14,
                                                    background: "linear-gradient(135deg, #135bec 0%, #4f8cff 100%)",
                                                    color: "#fff", boxShadow: "0 4px 18px rgba(19,91,236,.28)",
                                                }}>
                                                    <div>
                                                        <div style={{ fontSize: 11, opacity: .8, fontWeight: 500 }}>{t.mapEta}</div>
                                                        <div style={{ fontSize: 26, fontWeight: 900, lineHeight: 1.1 }}>{formatDuration(route.duration_s)}</div>
                                                    </div>
                                                    <div style={{ textAlign: "right" }}>
                                                        <div style={{ fontSize: 11, opacity: .8, fontWeight: 500 }}>{t.mapDistance}</div>
                                                        <div style={{ fontSize: 20, fontWeight: 700 }}>{formatDistance(route.distance_m)}</div>
                                                    </div>
                                                </div>

                                                {/* Start Nav button */}
                                                <button
                                                    onClick={() => setNavMode(true)}
                                                    style={{
                                                        width: "100%", height: 44, borderRadius: 22, border: "none",
                                                        background: "linear-gradient(135deg, #16a34a, #15803d)",
                                                        color: "#fff", fontFamily: "inherit", fontWeight: 700, fontSize: 14,
                                                        boxShadow: "0 3px 12px rgba(22,163,74,.30)",
                                                        display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                                                        cursor: "pointer",
                                                    }}
                                                >
                                                    <span className="material-symbols-outlined" style={{ fontSize: 20 }}>navigation</span>
                                                    Start Navigation
                                                </button>

                                                {/* Steps */}
                                                <div>
                                                    <div style={{ fontSize: 13, fontWeight: 700, color: "#374151", marginBottom: 8, display: "flex", alignItems: "center", gap: 6 }}>
                                                        <span className="material-symbols-outlined" style={{ fontSize: 16, color: "#135bec" }}>route</span>
                                                        {t.mapSteps}
                                                    </div>
                                                    {Array.isArray(route.steps) && route.steps.length > 0 ? (
                                                        <div style={{ position: "relative", paddingLeft: 18, borderLeft: "2px solid #e5e7eb", display: "flex", flexDirection: "column", gap: 12 }}>
                                                            {route.steps.map((step, idx) => (
                                                                <div key={idx} style={{ position: "relative" }}>
                                                                    <div style={{ position: "absolute", left: -23, top: 5, width: 10, height: 10, background: "#135bec", borderRadius: "50%", border: "2px solid #fff", boxShadow: "0 0 0 2px #135bec" }} />
                                                                    <div style={{ background: "#f9fafb", border: "1px solid #f0f0f0", borderRadius: 10, padding: "8px 10px" }}>
                                                                        <div style={{ fontSize: 12, fontWeight: 500, color: "#1f2937", lineHeight: 1.4 }}>{step.instruction}</div>
                                                                        <div style={{ display: "flex", gap: 10, marginTop: 4, fontSize: 11, color: "#6b7280", fontWeight: 600 }}>
                                                                            <span style={{ display: "flex", alignItems: "center", gap: 3 }}>
                                                                                <span className="material-symbols-outlined" style={{ fontSize: 12 }}>straighten</span>{formatDistance(step.distance_m)}
                                                                            </span>
                                                                            <span style={{ display: "flex", alignItems: "center", gap: 3 }}>
                                                                                <span className="material-symbols-outlined" style={{ fontSize: 12 }}>schedule</span>{formatDuration(step.duration_s)}
                                                                            </span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    ) : (
                                                        <div style={{ fontSize: 13, color: "#6b7280", padding: "10px 12px", background: "#f9fafb", borderRadius: 10 }}>{t.mapNoSteps}</div>
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                    </React.Fragment>
                                )}
                            </div>
                        </div>

                        {/* ── Map Canvas ── */}
                        <div className="map-canvas">
                            <div style={{position:"absolute", bottom:80, left:12, zIndex:500, maxWidth:340, maxHeight:"35%", overflow:"auto"}}><MapHours campus={campus}/></div>
                            <div id="map-el" ref={mapContainerRef} />

                            {/* FABs */}
                            <div style={{ position: "absolute", top: 14, right: 14, zIndex: 500, display: "flex", flexDirection: "column", gap: 8 }}>
                                <button
                                    className="map-fab"
                                    style={{ background: locationPermission === "granted" ? "#135bec" : "#fff", color: locationPermission === "granted" ? "#fff" : "#374151" }}
                                    onClick={locationPermission === "granted" ? useMyLocationAsOrigin : enableLocation}
                                    aria-label={t.mapEnableLocation}
                                    title={t.mapEnableLocation}
                                >
                                    <span className="material-symbols-outlined" style={{ fontSize: 21 }}>
                                        {locationPermission === "granted" ? "my_location" : "location_searching"}
                                    </span>
                                </button>
                                {route && routeLayerRef.current && (
                                    <button
                                        className="map-fab"
                                        style={{ background: "#fff", color: "#374151" }}
                                        onClick={() => mapRef.current && routeLayerRef.current && mapRef.current.fitBounds(routeLayerRef.current.getBounds(), { padding: [40, 40] })}
                                        aria-label="Fit route"
                                        title="Fit route"
                                    >
                                        <span className="material-symbols-outlined" style={{ fontSize: 20 }}>fit_screen</span>
                                    </button>
                                )}
                            </div>

                            {/* Error toast */}
                            {(locationPermission === "denied" || locationPermission === "unavailable" || !leafletReady) && (
                                <div style={{ position: "absolute", top: 14, left: 14, right: 70, zIndex: 500 }}>
                                    <div style={{ background: "#fef2f2", color: "#b91c1c", fontSize: 12, padding: "8px 14px", borderRadius: 10, boxShadow: "0 2px 8px rgba(0,0,0,.10)" }}>
                                        {!leafletReady ? "Map engine failed to load. Refresh the page."
                                            : locationPermission === "denied" ? t.mapLocationDenied
                                            : t.mapLocationUnavailable}
                                    </div>
                                </div>
                            )}

                            {/* Navigation HUD */}
                            {navMode && route && (
                                <div className="nav-hud">
                                    <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
                                        <div style={{ flex: 1 }}>
                                            <div style={{ fontSize: 11, opacity: .8, fontWeight: 500, marginBottom: 2 }}>Navigating to</div>
                                            <div style={{ fontSize: 16, fontWeight: 700, lineHeight: 1.2 }}>{selectedDestination ? selectedDestination.name : ""}</div>
                                            {Array.isArray(route.steps) && route.steps.length > 0 && (
                                                <div style={{ marginTop: 8, fontSize: 13, opacity: .9, fontWeight: 500, display: "flex", alignItems: "center", gap: 6 }}>
                                                    <span className="material-symbols-outlined" style={{ fontSize: 18, flexShrink: 0 }}>turn_right</span>
                                                    {route.steps[Math.min(stepIndex, route.steps.length - 1)].instruction}
                                                </div>
                                            )}
                                        </div>
                                        <div style={{ textAlign: "right", flexShrink: 0 }}>
                                            <div style={{ fontSize: 22, fontWeight: 900 }}>{formatDuration(route.duration_s)}</div>
                                            <div style={{ fontSize: 12, opacity: .8 }}>{formatDistance(route.distance_m)}</div>
                                        </div>
                                    </div>
                                    <div className="flex gap-3 mt-3">
                                        <button disabled={stepIndex === 0} onClick={() => setStepIndex(i => i - 1)}>Previous step</button>
                                        <span aria-live="polite">Step {stepIndex + 1} of {route.steps.length}</span>
                                        <button disabled={stepIndex >= route.steps.length - 1} onClick={() => setStepIndex(i => i + 1)}>Next step</button>
                                    </div>
                                    <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                                        <button
                                            onClick={() => setNavMode(false)}
                                            style={{ flex: 1, height: 36, borderRadius: 18, border: "1.5px solid rgba(255,255,255,.5)", background: "none", color: "#fff", fontFamily: "inherit", fontWeight: 600, fontSize: 13, cursor: "pointer" }}
                                        >
                                            Exit Navigation
                                        </button>
                                        <button
                                            onClick={() => { mapRef.current && routeLayerRef.current && mapRef.current.fitBounds(routeLayerRef.current.getBounds(), { padding: [40, 40] }); }}
                                            style={{ height: 36, width: 36, borderRadius: 18, border: "none", background: "rgba(255,255,255,.2)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}
                                        >
                                            <span className="material-symbols-outlined" style={{ fontSize: 18 }}>fit_screen</span>
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>

                    </div>

                    <BottomNav active="map" />
                </div>
            );
        };

        const MapHours = ({campus}) => {
            const [hours, setHours] = useState([]);
            useEffect(() => {
                let active = true;
                setHours([]);
                fetch(`${API_BASE}/api/opening-hours?campus=${encodeURIComponent(campus)}`)
                    .then(r => r.ok ? r.json() : []).then(data => {if (active) setHours(data);}).catch(() => {});
                return () => {active = false;};
            }, [campus]);
            return <details className="p-3 text-sm bg-white text-gray-900"><summary>Campus opening hours</summary>
                {hours.length ? hours.map(h => <div key={h.url} className="py-2"><a className="underline" target="_blank" rel="noopener noreferrer" href={h.url}>{h.title}</a><p className="whitespace-pre-line mt-2">{h.description}</p></div>) : <p className="py-2">No opening hours are available here. Ask UniBot or check the venue’s official page.</p>}
            </details>;
        };
        const CampusInformationPage = ({events = false}) => {
            const t = useT();
            const {campus} = usePreferences();
            const [items, setItems] = useState([]);
            const [status, setStatus] = useState("loading");
            const [retry, setRetry] = useState(0);
            useEffect(() => {
                const controller = new AbortController();
                setStatus("loading");
                fetch(`${API_BASE}/api/${events ? "events" : "services"}?campus=${encodeURIComponent(campus)}`, {signal: controller.signal})
                    .then(r => { if (!r.ok) throw Error(); return r.json(); })
                    .then(data => {setItems(data); setStatus("ready");})
                    .catch(e => {if (e.name !== "AbortError") setStatus("error");});
                return () => controller.abort();
            }, [campus, events, retry]);
            return <div className="min-h-screen pb-24"><Header />
                <main className="max-w-[960px] mx-auto px-4 py-8">
                    <section className="resource-banner"><div><span className="campus-badge">{campus.replaceAll("-", " ")}</span><h2 className="text-3xl font-black">{events ? t.eventsTitle : t.servicesTitle}</h2></div><CampusPhoto campus={campus} decorative/></section>
                    <p className="mt-3">Official university information for {campus.replaceAll("-", " ")}. Check the source for the latest details.</p>
                    {status === "loading" && <p role="status" className="py-6">Loading university information…</p>}
                    {status === "error" && <p role="alert" className="py-6">Information could not be loaded. <button className="underline" onClick={() => setRetry(n => n+1)}>Try again</button></p>}
                    {status === "ready" && !items.length && <p className="py-6">No {events ? "upcoming events" : "services"} are listed for this campus. Try another campus in Settings.</p>}
                    {status === "ready" && <div className="resource-grid">{items.map((item, index) => <article key={item.url} aria-label={item.title} className={`resource-card ${events ? "event-card" : "service-card"}`}>
                        {events ? <div className="event-date" aria-hidden="true"><span>{new Date(item.start).toLocaleDateString(undefined, {month:"short"})}</span><strong>{new Date(item.start).getDate()}</strong><span>{new Date(item.start).toLocaleDateString(undefined, {weekday:"short"})}</span></div> : <div className={`service-icon tone-${index % 3}`} aria-hidden="true"><span className="material-symbols-outlined">{/wellbeing|health/i.test(item.title) ? "favorite" : /career/i.test(item.title) ? "work" : /accommodation/i.test(item.title) ? "home" : /it |comput/i.test(item.title) ? "devices" : "support_agent"}</span></div>}
                        <div className="resource-content"><h3>{item.title}</h3>
                        {events ? <React.Fragment><p className="event-time"><span className="material-symbols-outlined" aria-hidden="true">schedule</span><time dateTime={item.start}>{new Date(item.start).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</time>{item.end && ` – ${new Date(item.end).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}`} · venue local time</p><p className="event-venue"><span className="material-symbols-outlined" aria-hidden="true">location_on</span>{item.location}</p>
                        <div className="resource-actions"><a href={item.url} target="_blank" rel="noopener noreferrer">View event <span aria-hidden="true">↗</span></a><Link to={`/map?q=${encodeURIComponent(item.location || item.title)}`}>Find venue</Link></div></React.Fragment> : <React.Fragment><p className="service-preview">{item.description}</p><details><summary>About this service</summary><p>{item.description}</p></details><a className="service-action" href={item.url} target="_blank" rel="noopener noreferrer">Visit official page <span aria-hidden="true">↗</span></a></React.Fragment>}
                        </div></article>)}</div>}

                </main><BottomNav active={events ? "events" : "services"}/></div>;
        };
        const ServicesPage = () => <CampusInformationPage />;
        const EventsPage = () => <CampusInformationPage events />;

        const OnboardingPage = () => {
            const navigate = useNavigate();
            const t = useT();
            const {
                uiLanguage,
                autoDetectEnabled,
                activeLanguage,
                setLanguage,
                toggleAutoDetect,
                sessionDetectedLanguage
            } = useLanguage();
            const getLangLabel = (langId) => {
                const match = LANG_OPTIONS.find((l) => l.id === langId);
                return match ? match.label : langId;
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="w-full max-w-[640px] bg-white dark:bg-gray-900 rounded-2xl shadow-xl p-6 border border-gray-200 dark:border-gray-800">
                        <h2 className="text-2xl font-bold">{t.onboardingTitle}</h2>
                        <p className="text-sm text-gray-500 mt-1">{t.onboardingSubtitle}</p>

                        <div className="mt-5 p-3 rounded-lg bg-gray-50 dark:bg-gray-800 text-sm">
                            <div><span className="font-semibold">{t.activeLanguage}:</span> {getLangLabel(activeLanguage)}</div>
                            <div className="mt-1"><span className="font-semibold">{t.selectedLanguage}:</span> {getLangLabel(uiLanguage)}</div>
                            {sessionDetectedLanguage && autoDetectEnabled && (
                                <div className="mt-1 text-primary">Auto-detected this session: {getLangLabel(sessionDetectedLanguage)}</div>
                            )}
                        </div>

                        <div className="mt-4 space-y-3">
                            {LANG_OPTIONS.map((lang) => (
                                <label key={lang.id} className={`flex items-center gap-3 p-3 border-2 rounded-xl cursor-pointer ${activeLanguage === lang.id ? "border-primary bg-primary/5" : "border-gray-200 dark:border-gray-700"}`}>
                                    <input type="radio" checked={uiLanguage === lang.id} onChange={() => setLanguage(lang.id)} />
                                    <span className="font-medium">{lang.label}</span>
                                    {activeLanguage === lang.id && <span className="text-xs text-primary ml-auto">Active</span>}
                                </label>
                            ))}
                        </div>

                        <label className="mt-5 flex items-center gap-3 p-3 rounded-xl bg-gray-50 dark:bg-gray-800 cursor-pointer">
                            <input type="checkbox" checked={autoDetectEnabled} onChange={toggleAutoDetect} />
                            <span className="text-sm">{t.autoDetect}</span>
                        </label>

                        <button onClick={() => navigate("/")} className="mt-6 w-full h-11 rounded-xl bg-primary text-white font-bold">
                            {t.confirm}
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            return (
                <LanguageProvider><Preferences>
                    <Routes>
                        <Route path="/" element={<HomePage />} />
                        <Route path="/chat" element={<ChatPage />} />
                        <Route path="/map" element={<MapPage />} />
                        <Route path="/services" element={<ServicesPage />} />
                        <Route path="/events" element={<EventsPage />} />
                        <Route path="/onboarding" element={<OnboardingPage />} />
                    </Routes>
                </Preferences></LanguageProvider>
            );
        };

        const root = createRoot(document.getElementById("root"));
        root.render(
            <BrowserRouter>
                <App />
            </BrowserRouter>
        );
    </script>
</body>
</html>
